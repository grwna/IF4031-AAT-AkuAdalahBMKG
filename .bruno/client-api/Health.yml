info:
  name: Health
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:{{CLIENT_API_PORT}}/health
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200 with aggregator dependency status", function () {
          expect(res.status).to.equal(200);
          expect(res.body.service).to.equal("client-api");
          expect(res.body.status).to.be.oneOf(["UP", "DEGRADED"]);
          expect(res.body.dependencies.aggregator).to.be.oneOf(["UP", "DOWN"]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
