info:
  name: Hazards Media
  type: http
  seq: 6

http:
  method: GET
  url: http://localhost:{{CLIENT_API_PORT}}/hazards?limit=10
  params:
    - name: limit
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{mediaAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("media receives summary fields only", function () {
          expect(res.status).to.equal(200);
          res.body.data.forEach(function (h) {
            expect(h).to.not.have.any.keys("source_ref_id", "latitude", "longitude", "attributes");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
