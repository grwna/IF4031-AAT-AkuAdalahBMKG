info:
  name: Hazards Field
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:{{CLIENT_API_PORT}}/hazards?limit=10
  params:
    - name: limit
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{fieldAccessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body.data.length > 0) {
          bru.setVar("hazardId", res.body.data[0].hazard_id);
        }
    - type: tests
      code: |-
        test("field team receives all fields including raw", function () {
          expect(res.status).to.equal(200);
          expect(res.body).to.have.property("source_status");
          res.body.data.forEach(function (h) {
            expect(h).to.include.keys("hazard_id", "severity", "source_ref_id", "attributes");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
