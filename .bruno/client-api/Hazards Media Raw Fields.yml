info:
  name: Hazards Media Raw Fields
  type: http
  seq: 7

http:
  method: GET
  url: http://localhost:{{CLIENT_API_PORT}}/hazards?fields=severity,latitude
  params:
    - name: fields
      value: severity,latitude
      type: query
  auth:
    type: bearer
    token: "{{mediaAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("media explicit raw field request is rejected", function () {
          expect(res.status).to.equal(403);
          expect(res.body.error.code).to.equal("INSUFFICIENT_SCOPE");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
