info:
  name: Hazard Raw Field
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:{{CLIENT_API_PORT}}/hazards/{{hazardId}}/raw
  auth:
    type: bearer
    token: "{{fieldAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("field team receives raw view", function () {
          expect(res.status).to.equal(200);
          expect(res.body.data).to.have.all.keys("hazard_id", "source_ref_id", "latitude", "longitude", "attributes");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
