[build]
cmd = "go build -o ./tmp/main ./cmd/server"
bin = "./tmp/main"

# Watch changes
include_ext = ["go", "tpl", "tmpl", "html", "env"]
exclude_dir = ["assets", "tmp", "vendor", "docs"]

delay = 1000 # ms

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"